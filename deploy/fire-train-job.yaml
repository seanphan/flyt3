apiVersion: batch/v1
kind: Job
metadata:
  name: fly-fire-train
  namespace: flyc4
  labels: { app: flyc4, tier: fire-train }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels: { app: flyc4, tier: fire-train }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3s-w6 }
      containers:
        - name: fire-train
          image: flyc4:latest
          imagePullPolicy: Never
          command: ["python", "-m", "flyc4.fire_detect",
                    "--images", "/library/datasets/fire_sat/flame/train_images",
                    "--val-images", "/library/datasets/fire_sat/flame/val_images",
                    "--limit", "4500", "--val-limit", "1500",
                    "--epochs", "40",
                    "--out", "/library/datasets/flyc4/live/fire"]
          resources:
            limits: { nvidia.com/gpu: "1", memory: 16Gi, cpu: "5" }
          volumeMounts:
            - { name: library, mountPath: /library }
      volumes:
        - name: library
          hostPath: { path: /library }
      restartPolicy: Never
