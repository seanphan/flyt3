apiVersion: apps/v1
kind: Deployment
metadata:
  name: fly-web
  namespace: flyc4
  labels:
    app: flyc4
spec:
  replicas: 1
  selector:
    matchLabels: { app: flyc4, tier: web }
  template:
    metadata:
      labels: { app: flyc4, tier: web }
    spec:
      # hardware-label selection per the platform rule; lands on any free 3090
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: hardware, operator: In, values: [rtx3090-x1] }
                  - { key: kubernetes.io/hostname, operator: In, values: [k3s-w5, k3s-w6] }
                  - { key: nvidia.com/gpu.present, operator: In, values: ["true"] }
      containers:
        - name: web
          image: flyc4:latest
          imagePullPolicy: Never
          command: ["uvicorn", "serve.app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: FLYC4_DEVICE, value: cpu }
            - { name: FLYC4_OUT, value: /library/datasets/flyc4/live }
          ports:
            - { containerPort: 8000, name: http }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              memory: 8Gi
              cpu: "3"
          volumeMounts:
            - { name: library, mountPath: /library, readOnly: true }
      volumes:
        - name: library
          hostPath:
            path: /library
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: fly-web
  namespace: flyc4
spec:
  type: NodePort
  selector: { app: flyc4, tier: web }
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30180
