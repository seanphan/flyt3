apiVersion: batch/v1
kind: Job
metadata:
  name: fly-smoke
  namespace: flyc4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: flyc4, tier: train }
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-w5
      containers:
        - name: train
          image: flyc4:latest
          imagePullPolicy: Never
          command: ["python", "-m", "flyc4.train",
                    "--batches", "3", "--games", "256", "--eval-every", "3",
                    "--save-every", "3", "--out", "/out"]
          resources:
            limits: { nvidia.com/gpu: "1", memory: 16Gi, cpu: "6" }
          volumeMounts:
            - { name: out, mountPath: /out }
            - { name: library, mountPath: /library, readOnly: true }
      volumes:
        - name: out
          persistentVolumeClaim: { claimName: flyc4-out }
        - name: library
          hostPath: { path: /library, type: Directory }
      restartPolicy: Never
