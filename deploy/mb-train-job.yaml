apiVersion: batch/v1
kind: Job
metadata:
  name: fly-mb-train
  namespace: flyc4
  labels:
    app: flyc4
    tier: mb-train
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels: { app: flyc4, tier: mb-train }
    spec:
      # w5 holds the second idle 3090; the w6 3090 runs the REINFORCE job
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [k3s-w5] }
                  - { key: nvidia.com/gpu.present, operator: In, values: ["true"] }
      containers:
        - name: mb-train
          image: flyc4:latest
          imagePullPolicy: Never
          command: ["python", "-m", "flyc4.train_mb",
                    "--games", "1000000", "--eval-every", "25000",
                    "--out", "/library/datasets/flyc4/live"]
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 8Gi
              cpu: "3"
          volumeMounts:
            - { name: library, mountPath: /library }
      volumes:
        - name: library
          hostPath: { path: /library }
      restartPolicy: Never
