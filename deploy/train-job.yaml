apiVersion: batch/v1
kind: Job
metadata:
  name: fly-train
  namespace: flyc4
  labels:
    app: flyc4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: flyc4
    spec:
      # user-directed placement: k3s-w5 (RTX 3090, devpod lane)
      nodeSelector:
        kubernetes.io/hostname: k3s-w5
      containers:
        - name: train
          image: flyc4:latest
          imagePullPolicy: Never
          command: ["python", "-m", "flyc4.train",
                    "--batches", "200", "--games", "512", "--steps", "64", "--lr", "1.2e-2",
                    "--out", "/out", "--resume"]
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 16Gi
              cpu: "6"
          volumeMounts:
            - { name: out, mountPath: /out }
            - { name: library, mountPath: /library, readOnly: true }
      volumes:
        - name: out
          persistentVolumeClaim:
            claimName: flyc4-out
        - name: library
          hostPath:
            path: /library
            type: Directory
      restartPolicy: Never
