apiVersion: batch/v1
kind: Job
metadata:
  name: fly-train
  namespace: flyc4
  labels:
    app: flyc4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: flyc4
    spec:
      # user-directed placement on k3s-w6; selection follows the platform rule
      # (hardware capability labels + gpu.present, never device-plugin overrides)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [k3s-w6] }
                  - { key: hardware, operator: In, values: [rtx3090-x1] }
                  - { key: nvidia.com/gpu.present, operator: In, values: ["true"] }
      containers:
        - name: train
          image: flyc4:latest
          imagePullPolicy: Never
          command: ["python", "-m", "flyc4.train",
                    "--batches", "200", "--games", "512", "--steps", "64", "--lr", "1.2e-2",
                    "--out", "/out", "--resume"]
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 16Gi
              cpu: "6"
          volumeMounts:
            - { name: out, mountPath: /out }
            - { name: library, mountPath: /library, readOnly: true }
      volumes:
        - name: out
          persistentVolumeClaim:
            claimName: flyc4-out
        - name: library
          hostPath:
            path: /library
            type: Directory
      restartPolicy: Never
